# Field map for the URLA / Form 1003 (2019+ layout), first three pages.
#
# Everything the extractor knows about this form lives here. Supporting a new
# form variant means copying this file and changing labels/anchors, not code.
#
# Strategy order for every scalar field: widget -> label-anchored -> regex.
#   widget_name     AcroForm field name; used first when present in the PDF
#   label           printed label text (fuzzy matched), or a list of aliases
#   strategy        right | below | checkbox_group | checkbox | count | regex
#   region          search box relative to the label, in PDF points
#   pattern         regex the label-anchored value must match (group 1 if any)
#   regex           fallback regex over the group's scope text (group 1)
#   type            normalizer hint used for pattern checks and debugging
#   scope           field-level override of the group scope {after, before}
#   phrase_start    false when the label is printed mid-sentence
#
# Coordinates are PDF points (1/72 in); OCR'd scans are mapped to the same space.

form: urla_1003
description: Uniform Residential Loan Application (Freddie Mac 65 / Fannie Mae 1003)
max_pages: 3

settings:
  label_threshold: 80           # rapidfuzz ratio needed to accept a label
  checkbox_fill_threshold: 0.15 # OpenCV fill ratio above which a box is checked
  low_confidence_threshold: 0.7
  consistency_tolerance: 1.00   # dollars

# Form sections, located by anchor phrases on whatever page they appear.
form_sections:
  section_1:
    anchors: ["Section 1: Borrower Information", "1a. Personal Information",
              "1b. Current Employment/Self-Employment and Income", "Gross Monthly Income"]
    page_hint: 1
  section_2:
    anchors: ["Section 2: Financial Information - Assets and Liabilities",
              "2a. Assets - Bank, Retirement, and Other Accounts You Have",
              "2c. Liabilities - Credit Cards, Other Debts, and Leases that You Owe"]
    page_hint: 2
  section_3:
    anchors: ["Section 3: Financial Information - Real Estate", "3a. Property You Own"]
    page_hint: 3
  section_4:
    anchors: ["Section 4: Loan and Property Information", "4a. Loan and Property Information",
              "4d. Gifts or Grants You Have Been Given or Will Receive for this Loan"]
    page_hint: 3

# Output groups: which form section they live in and the vertical sub-scope.
sections:
  borrower_information:
    form_section: section_1
    scope: {after: "1a. Personal Information", before: ["Contact Information", "Home Phone"]}
  contact_information:
    form_section: section_1
    scope: {after: ["Contact Information", "Home Phone"], before: "Current Address"}
  address_information:
    form_section: section_1
    scope: {after: "Current Address", before: "1b. Current Employment/Self-Employment and Income"}
  employment_information:
    form_section: section_1
    scope: {after: "1b. Current Employment/Self-Employment and Income"}
  income_information:
    form_section: section_1
    scope: {after: "Gross Monthly Income"}
  assets:
    form_section: section_2
    scope: {after: "2a. Assets", before: "2b. Other Assets and Credits You Have"}
  other_assets:
    form_section: section_2
    scope: {after: "2b. Other Assets and Credits You Have", before: "2c. Liabilities"}
  liabilities:
    form_section: section_2
    scope: {after: "2c. Liabilities"}
  real_estate_information:
    form_section: section_3
    scope: {after: "3a. Property You Own"}
  loan_information:
    form_section: section_4
    scope: {after: "4a. Loan and Property Information", before: "1. Mixed-Use Property"}
  property_details:
    form_section: section_4
    scope: {after: "1. Mixed-Use Property", before: "4d. Gifts or Grants"}
  gift_information:
    form_section: section_4
    scope: {after: "4d. Gifts or Grants"}

# Extra phrases that terminate a value run (in addition to every label above/below).
stop_labels: ["/month", "Ext.", "Years", "Months", "Unit #", "Phone", "Ages", "Status"]

fields:
  # ------------------------------------------------------------- 1a borrower
  borrower_name:
    section: borrower_information
    label: "Name (First, Middle, Last, Suffix)"
    strategy: below
    region: {width: 250, height: 25}
    type: text
    required: true
  social_security_number:
    section: borrower_information
    label: "Social Security Number"
    strategy: below
    region: {width: 180, height: 25}
    pattern: '\d{3}\D{0,2}\d{2}\D{0,2}\d{4}'
    regex: '(\d{3}-\d{2}-\d{4})'
    type: ssn
    required: true
  date_of_birth:
    section: borrower_information
    label: "Date of Birth (mm/dd/yyyy)"
    strategy: below
    region: {width: 180, height: 25}
    pattern: '\d{1,2}\s*[/\-.]\s*\d{1,2}\s*[/\-.]\s*\d{2,4}'
    regex: 'Date of Birth.*?\n.*?(\d{1,2}/\d{1,2}/\d{4})'
    type: date
    required: true
  alternate_names:
    section: borrower_information
    label: "Alternate Names - List any names by which you are known"
    strategy: below
    region: {width: 300, height: 25}
    regex: 'Alternate Names.*?\n\s*(No AKAs|[A-Za-z][A-Za-z.-]*(?:\s+[A-Za-z][A-Za-z.-]*){0,4})'
    type: text
  citizenship_status:
    section: borrower_information
    label: "Citizenship"
    strategy: checkbox_group
    options: ["U.S. Citizen", "Permanent Resident Alien", "Non-Permanent Resident Alien"]
    type: choice
  credit_type:
    section: borrower_information
    label: "Type of Credit"
    strategy: checkbox_group
    options:
      "I am applying for individual credit": Individual
      "I am applying for joint credit": Joint
    type: choice
  total_borrowers:
    section: borrower_information
    label: "Total Number of Borrowers:"
    strategy: right
    phrase_start: false
    region: {width: 40}
    pattern: '\d+'
    regex: 'Total Number of Borrowers:?\s*(\d+)'
    type: int
  marital_status:
    section: borrower_information
    label: "Marital Status"
    scope: {before: "Current Address"}
    band: {height: 12}
    strategy: checkbox_group
    options: ["Married", "Separated", "Unmarried"]
    type: choice
  number_of_dependents:
    section: borrower_information
    label: "Number"
    scope: {after: "Dependents", before: "Current Address"}
    strategy: right
    region: {width: 30}
    pattern: '\d+'
    type: int

  # --------------------------------------------------------------- contact
  home_phone:
    section: contact_information
    label: "Home Phone"
    strategy: right
    region: {width: 120}
    pattern: '\(?\d{3}\)?[\s.\-]*\d{3}[\s.\-]*\d{4}'
    type: phone
  cell_phone:
    section: contact_information
    label: "Cell Phone"
    strategy: right
    region: {width: 120}
    pattern: '\(?\d{3}\)?[\s.\-]*\d{3}[\s.\-]*\d{4}'
    type: phone
  work_phone:
    section: contact_information
    label: "Work Phone"
    strategy: right
    region: {width: 110}
    pattern: '\(?\d{3}\)?[\s.\-]*\d{3}[\s.\-]*\d{4}'
    type: phone
  email:
    section: contact_information
    label: "Email"
    strategy: right
    region: {width: 260}
    pattern: '(?i:email)\s*([\w.%+\-]+\s*@\s*[\w.\-]+\.\w{2,})'
    regex: '(?i:email)\s*([\w.%+\-]+@[\w.\-]+\.\w{2,})'
    type: email

  # --------------------------------------------------------------- address
  street:
    section: address_information
    label: "Street"
    strategy: right
    region: {width: 240}
    type: text
  city:
    section: address_information
    label: "City"
    strategy: right
    region: {width: 150}
    type: text
  state:
    section: address_information
    label: "State"
    strategy: right
    region: {width: 40}
    type: state
  zip:
    section: address_information
    label: "ZIP"
    strategy: right
    region: {width: 60}
    pattern: '\d{5}(?:-\d{4})?'
    type: zip
  country:
    section: address_information
    label: "Country"
    strategy: right
    region: {width: 100}
    type: text
  years_at_address:
    section: address_information
    label: "How Long at Current Address?"
    strategy: right
    region: {width: 30}
    pattern: '\d{1,2}'
    regex: 'Current\s+Address\W+(\d{1,2})\s+Years'
    type: int
  months_at_address:
    section: address_information
    label: "Years"
    phrase_start: false
    strategy: right
    region: {width: 30}
    pattern: '\d{1,2}'
    regex: 'Years\s+(\d{1,2})\s+Months'
    type: int
  housing_type:
    section: address_information
    label: "Housing"
    strategy: checkbox_group
    options: ["No primary housing expense", "Own", "Rent"]
    type: choice

  # ------------------------------------------------------------ employment
  employer_name:
    section: employment_information
    label: "Employer or Business Name"
    strategy: right
    region: {width: 240}
    type: text
  employer_street:
    section: employment_information
    label: "Street"
    strategy: right
    region: {width: 240}
    type: text
  employer_city:
    section: employment_information
    label: "City"
    strategy: right
    region: {width: 150}
    type: text
  employer_state:
    section: employment_information
    label: "State"
    strategy: right
    region: {width: 40}
    type: state
  employer_zip:
    section: employment_information
    label: "ZIP"
    strategy: right
    region: {width: 60}
    pattern: '\d{5}(?:-\d{4})?'
    type: zip
  position_title:
    section: employment_information
    label: "Position or Title"
    strategy: right
    region: {width: 200}
    type: text
  employment_start_date:
    section: employment_information
    label: ["Start Date (mm/dd/yyyy)", "Start Date"]
    strategy: right
    region: {width: 100}
    pattern: '\d{1,2}\s*[/\-.]\s*\d{1,2}\s*[/\-.]\s*\d{2,4}'
    type: date
  years_in_profession:
    section: employment_information
    label: "How long in this line of work?"
    strategy: right
    region: {width: 30}
    pattern: '\d{1,2}'
    regex: 'line\s+of\s+work\W+(\d{1,2})\s+Years'
    type: int
  months_in_profession:
    section: employment_information
    label: "Years"
    phrase_start: false
    strategy: right
    region: {width: 30}
    pattern: '\d{1,2}'
    regex: 'Years\s+(\d{1,2})\s+Months'
    type: int

  # ---------------------------------------------------------------- income
  base_income:
    section: income_information
    label: "Base"
    strategy: right
    region: {width: 150}
    pattern: '[\$S]?\s*\d[\d,]*(?:\.\d{2})?'
    type: currency
  overtime_income:
    section: income_information
    label: "Overtime"
    strategy: right
    region: {width: 150}
    pattern: '[\$S]?\s*\d[\d,]*(?:\.\d{2})?'
    type: currency
  bonus_income:
    section: income_information
    label: "Bonus"
    strategy: right
    region: {width: 150}
    pattern: '[\$S]?\s*\d[\d,]*(?:\.\d{2})?'
    type: currency
  commission_income:
    section: income_information
    label: "Commission"
    strategy: right
    region: {width: 150}
    pattern: '[\$S]?\s*\d[\d,]*(?:\.\d{2})?'
    type: currency
  military_income:
    section: income_information
    label: "Military Entitlements"
    strategy: right
    region: {width: 150}
    pattern: '[\$S]?\s*\d[\d,]*(?:\.\d{2})?'
    type: currency
  other_income:
    section: income_information
    label: "Other"
    strategy: right
    region: {width: 150}
    pattern: '[\$S]?\s*\d[\d,]*(?:\.\d{2})?'
    type: currency
  total_monthly_income:
    section: income_information
    label: "TOTAL"
    strategy: right
    region: {width: 150}
    pattern: '[\$S]?\s*\d[\d,]*(?:\.\d{2})?'
    type: currency

  # ----------------------------------------------------------- real estate
  owns_real_estate:
    section: real_estate_information
    label: "I do not own any real estate"
    strategy: checkbox
    invert: true           # checked "I do not own" -> owns_real_estate = false
    type: bool
  property_count:
    section: real_estate_information
    label: "Street"
    strategy: count        # number of property blocks with a filled-in street
    region: {width: 220}
    type: int

  # ------------------------------------------------------------------ loan
  loan_amount:
    section: loan_information
    widget_name: loan_amount
    label: "Loan Amount $"
    strategy: right
    region: {width: 130}
    pattern: '\d[\d,]*(?:\.\d{2})?'
    type: currency
    required: true
  loan_purpose:
    section: loan_information
    label: "Loan Purpose"
    strategy: checkbox_group
    options:
      "Purchase": Purchase
      "Refinance": Refinance
      "Other (specify)": Other
    type: choice
  property_street:
    section: loan_information
    label: "Street"
    scope: {after: "Property Address", before: "Occupancy"}
    strategy: right
    region: {width: 240}
    type: text
  property_city:
    section: loan_information
    label: "City"
    strategy: right
    region: {width: 150}
    type: text
  property_state:
    section: loan_information
    label: "State"
    strategy: right
    region: {width: 40}
    type: state
  property_zip:
    section: loan_information
    label: "ZIP"
    strategy: right
    region: {width: 60}
    pattern: '\d{5}(?:-\d{4})?'
    type: zip
  property_county:
    section: loan_information
    label: "County"
    strategy: right
    region: {width: 130}
    type: text
  number_of_units:
    section: loan_information
    label: "Number of Units"
    strategy: right
    region: {width: 30}
    pattern: '\d+'
    type: int
  property_value:
    section: loan_information
    label: "Property Value $"
    strategy: right
    region: {width: 120}
    pattern: '\d[\d,]*(?:\.\d{2})?'
    type: currency
    required: true
  occupancy_type:
    section: loan_information
    label: "Occupancy"
    strategy: checkbox_group
    options: ["Primary Residence", "Second Home", "Investment Property", "FHA Secondary Residence"]
    widget_names:
      "Primary Residence": occupancy_primary
      "Second Home": occupancy_second
      "Investment Property": occupancy_investment
      "FHA Secondary Residence": occupancy_fha_secondary
    type: choice

  # ------------------------------------------------------ property details
  mixed_use_property:
    section: property_details
    label: "1. Mixed-Use Property"
    scope: {after: "1. Mixed-Use Property", before: "2. Manufactured Home"}
    strategy: checkbox_group
    band: {height: 22}
    options: {"NO": false, "YES": true}
    widget_names: {"NO": mixed_use_no, "YES": mixed_use_yes}
    type: bool
  manufactured_home:
    section: property_details
    label: "2. Manufactured Home"
    scope: {after: "2. Manufactured Home"}
    strategy: checkbox_group
    band: {height: 14}
    options: {"NO": false, "YES": true}
    type: bool

# Tables: located by header row, columns mapped by fuzzy header match.
tables:
  assets:
    section: assets
    columns:
      account_type: {headers: ["Account Type - use list above", "Account Type"], type: text}
      financial_institution: {headers: ["Financial Institution"], type: text}
      account_number: {headers: ["Account Number"], type: account}
      market_value: {headers: ["Cash or Market Value"], type: currency}
    key_columns: [account_type, financial_institution, account_number, market_value]
    total_row:
      labels: ["Provide TOTAL Amount Here", "TOTAL"]
      values: {total_assets: market_value}
  other_assets:
    section: other_assets
    columns:
      asset_type: {headers: ["Asset or Credit Type - use list above", "Asset or Credit Type"], type: text}
      market_value: {headers: ["Cash or Market Value"], type: currency}
    key_columns: [asset_type, market_value]
    total_row:
      labels: ["Provide TOTAL Amount Here", "TOTAL"]
      values: {total_other_assets: market_value}
    none_checkbox: "Check if you don't have any other assets"
  liabilities:
    section: liabilities
    columns:
      account_type: {headers: ["Account Type"], type: text}
      company_name: {headers: ["Company Name"], type: text}
      account_number: {headers: ["Account Number"], type: account}
      unpaid_balance: {headers: ["Unpaid Balance"], type: currency}
      paid_before_closing: {headers: ["To be paid off at or before closing", "To be paid off at"], type: checkbox}
      monthly_payment: {headers: ["Monthly Payment"], type: currency}
    key_columns: [account_type, company_name, account_number, unpaid_balance, monthly_payment]
    total_row:
      labels: ["TOTAL"]
      values: {total_unpaid_balance: unpaid_balance, total_monthly_debt_payment: monthly_payment}
    none_checkbox: "Check if you don't have any liabilities"
  gift_information:
    section: gift_information
    columns:
      gift_type: {headers: ["Asset Type: Cash Gift, Gift of Equity, Grant", "Asset Type"], type: text}
      deposited:
        headers: ["Deposited/Not Deposited"]
        type: checkbox_group
        options: {"Not Deposited": false, "Deposited": true}
      source: {headers: ["Source - use list above", "Source"], type: text}
      cash_or_market_value: {headers: ["Cash or Market Value"], type: currency}
    key_columns: [gift_type, source, cash_or_market_value]
    none_checkbox: "Does not apply"
